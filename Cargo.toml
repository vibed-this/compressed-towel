[package]
name = "compressed-towel"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = { version = "1.18.1", default-features = false, features = ["backend-winit", "renderer-software", "compat-1-2"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8" }
dirs = "6"
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
slint-build = { version = "1.18.1", default-features = false, features = ["renderer-software", "compat-1-18"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
